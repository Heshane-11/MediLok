{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultation Feedback | MediLok</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; }
        .hero-gradient { background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%); }
        .card { background: white; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        
        /* Star Rating Styles */
        .rating-group {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 0.5rem;
        }
        .rating-group input {
            display: none;
        }
        .rating-group label {
            cursor: pointer;
            font-size: 2rem;
            color: #cbd5e1;
            transition: color 0.15s ease, transform 0.15s ease;
        }
        .rating-group label:hover,
        .rating-group label:hover ~ label,
        .rating-group input:checked ~ label {
            color: #eab308;
            transform: scale(1.1);
        }
        .rating-group label:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

<!-- Top Bar -->
<div class="bg-white border-b border-slate-100 shadow-sm px-6 py-4 flex items-center justify-between">
    <span class="text-lg font-bold text-teal-700 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-teal-600"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        MediLok Patient Portal
    </span>
</div>

<!-- Header -->
<div class="hero-gradient text-white text-center py-12 px-4">
    <div class="max-w-2xl mx-auto">
        <span class="bg-white/20 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Session Ended</span>
        <h1 class="text-3xl font-extrabold mt-3">Consultation Review</h1>
        <p class="text-teal-100 mt-2 text-sm sm:text-base">Please tell us how was your experience with Dr. {{ req.doctor.doctor_name }} to finalize your consultation request.</p>
    </div>
</div>

<!-- Main Form -->
<div class="max-w-2xl mx-auto px-4 py-8 mb-16">
    <form method="POST" class="card p-8 space-y-8">
        {% csrf_token %}

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 rounded-xl px-5 py-4 text-sm font-semibold">
            {{ error }}
        </div>
        {% endif %}

        <!-- Question 1 -->
        <div class="space-y-2">
            <label class="block text-gray-800 font-bold text-base">
                1. How was your overall experience with the doctor?
            </label>
            <div class="rating-group">
                <input type="radio" id="q1-star5" name="rating_overall" value="5" required checked>
                <label for="q1-star5">&#9733;</label>
                <input type="radio" id="q1-star4" name="rating_overall" value="4">
                <label for="q1-star4">&#9733;</label>
                <input type="radio" id="q1-star3" name="rating_overall" value="3">
                <label for="q1-star3">&#9733;</label>
                <input type="radio" id="q1-star2" name="rating_overall" value="2">
                <label for="q1-star2">&#9733;</label>
                <input type="radio" id="q1-star1" name="rating_overall" value="1">
                <label for="q1-star1">&#9733;</label>
            </div>
        </div>

        <!-- Question 2 -->
        <div class="space-y-2">
            <label class="block text-gray-800 font-bold text-base">
                2. Did the doctor listen to you and understand your concerns well?
            </label>
            <div class="rating-group">
                <input type="radio" id="q2-star5" name="rating_listening" value="5" required checked>
                <label for="q2-star5">&#9733;</label>
                <input type="radio" id="q2-star4" name="rating_listening" value="4">
                <label for="q2-star4">&#9733;</label>
                <input type="radio" id="q2-star3" name="rating_listening" value="3">
                <label for="q2-star3">&#9733;</label>
                <input type="radio" id="q2-star2" name="rating_listening" value="2">
                <label for="q2-star2">&#9733;</label>
                <input type="radio" id="q2-star1" name="rating_listening" value="1">
                <label for="q2-star1">&#9733;</label>
            </div>
        </div>

        <!-- Question 3 -->
        <div class="space-y-2">
            <label class="block text-gray-800 font-bold text-base">
                3. How well did the doctor handle and guide you during the consultation?
            </label>
            <div class="rating-group">
                <input type="radio" id="q3-star5" name="rating_guidance" value="5" required checked>
                <label for="q3-star5">&#9733;</label>
                <input type="radio" id="q3-star4" name="rating_guidance" value="4">
                <label for="q3-star4">&#9733;</label>
                <input type="radio" id="q3-star3" name="rating_guidance" value="3">
                <label for="q3-star3">&#9733;</label>
                <input type="radio" id="q3-star2" name="rating_guidance" value="2">
                <label for="q3-star2">&#9733;</label>
                <input type="radio" id="q3-star1" name="rating_guidance" value="1">
                <label for="q3-star1">&#9733;</label>
            </div>
        </div>

        <!-- Question 4 -->
        <div class="space-y-2">
            <label class="block text-gray-800 font-bold text-base">
                4. Was the advice or prescription given by the doctor clear and helpful?
            </label>
            <div class="rating-group">
                <input type="radio" id="q4-star5" name="rating_clarity" value="5" required checked>
                <label for="q4-star5">&#9733;</label>
                <input type="radio" id="q4-star4" name="rating_clarity" value="4">
                <label for="q4-star4">&#9733;</label>
                <input type="radio" id="q4-star3" name="rating_clarity" value="3">
                <label for="q4-star3">&#9733;</label>
                <input type="radio" id="q4-star2" name="rating_clarity" value="2">
                <label for="q4-star2">&#9733;</label>
                <input type="radio" id="q4-star1" name="rating_clarity" value="1">
                <label for="q4-star1">&#9733;</label>
            </div>
        </div>

        <!-- Question 5 -->
        <div class="space-y-2">
            <label class="block text-gray-800 font-bold text-base">
                5. How likely are you to recommend this doctor to other patients?
            </label>
            <div class="rating-group">
                <input type="radio" id="q5-star5" name="rating_recommend" value="5" required checked>
                <label for="q5-star5">&#9733;</label>
                <input type="radio" id="q5-star4" name="rating_recommend" value="4">
                <label for="q5-star4">&#9733;</label>
                <input type="radio" id="q5-star3" name="rating_recommend" value="3">
                <label for="q5-star3">&#9733;</label>
                <input type="radio" id="q5-star2" name="rating_recommend" value="2">
                <label for="q5-star2">&#9733;</label>
                <input type="radio" id="q5-star1" name="rating_recommend" value="1">
                <label for="q5-star1">&#9733;</label>
            </div>
        </div>

        <!-- Comments -->
        <div class="space-y-2 border-t border-gray-100 pt-6">
            <label for="comments" class="block text-gray-800 font-bold text-base">
                Additional Comments (Optional)
            </label>
            <textarea id="comments" name="comments" rows="3" 
                      class="w-full px-4 py-3 border border-gray-200 rounded-lg outline-none focus:border-teal-500 transition text-sm text-gray-700 bg-gray-50 focus:bg-white"
                      placeholder="e.g. Dr. {{ req.doctor.doctor_name }} was extremely polite and descriptive..."></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" 
                class="w-full py-3.5 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white rounded-xl font-bold shadow-lg shadow-teal-700/10 transition duration-150 transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
            Submit Review & Complete Consultation
        </button>
    </form>
</div>

</body>
</html>
