{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 + ReactDOM (jsDelivr — faster than unpkg in India) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js" crossorigin></script>

    <!-- Babel Standalone for in-browser JSX compilation (jsDelivr) -->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>

    <!-- CSRF Token -->
    <script>
        (function() {
            function getCookie(name) {
                var v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
                return v ? decodeURIComponent(v[2]) : null;
            }
            window.csrfToken = getCookie('csrftoken');
        })();
    </script>

    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; margin: 0; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
        .animate-pulse { animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
    </style>
</head>
<body>

    {% if dashboard_data_json %}
    <script>
        window.dashboardData = {{ dashboard_data_json|safe }};
    </script>
    {% endif %}

    <div id="root">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
