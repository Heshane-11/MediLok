{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>MediLok</title>

  <link rel="icon" type="image/png" href="{% static 'assets/img/favicon.png' %}">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900">
  <link href="{% static 'assets/css/material-dashboard.css' %}" rel="stylesheet" />
</head>

<body class="bg-gray-200">

<!-- Navbar -->
<div class="container position-sticky z-index-sticky top-0">
  <nav class="navbar navbar-expand-lg bg-white shadow-sm px-4 mt-3">

    <a class="navbar-brand" href="{% url 'dashboard' %}">MediLok</a>

    <div class="ms-auto">
      <a href="{% url 'dashboard' %}" class="me-3">Dashboard</a>
      <a href="{% url 'profile' %}" class="me-3">Profile</a>
      <a href="{% url 'signup' %}" class="me-3">Sign Up</a>
      <a href="{% url 'login' %}">Sign In</a>
    </div>

  </nav>
</div>

<!-- Main -->
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="card p-4 shadow" style="width: 400px;">

    <h3 class="text-center mb-3">Doctor Sign In</h3>

    <!-- 🔴 ERROR MESSAGE -->
    {% if error %}
      <p style="color:red; text-align:center;">{{ error }}</p>
    {% endif %}

    <!-- ✅ FORM FIXED -->
    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <input type="text" name="username" class="form-control" placeholder="Username" required>
      </div>

      <div class="mb-3">
        <input type="password" name="password" class="form-control" placeholder="Password" required>
      </div>

      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="rememberMe">
        <label for="rememberMe">Remember me</label>
      </div>

      <button type="submit" class="btn btn-primary w-100">Sign In</button>

    </form>

    <p class="text-center mt-3">
      Not registered as a doctor?
      <a href="{% url 'doctor_signup' %}">Sign up</a>
    </p>

  </div>

</div>

</body>
</html>
