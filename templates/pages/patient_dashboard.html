{% extends 'base_react.html' %}
{% load static %}
{% block title %}Patient Dashboard{% endblock %}
{% block content %}
<div id="react-app"></div>
<script type="text/babel">
{% verbatim %}
    const { useState, useEffect } = React;

    // ── Inline SVG Icons (no CDN needed) ─────────────────────────────────
    const Svg = ({ size=20, className="", children }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
             fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"
             strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Activity     = p => <Svg {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></Svg>;
    const Calendar     = p => <Svg {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></Svg>;
    const ChevronRight = p => <Svg {...p}><polyline points="9 18 15 12 9 6"/></Svg>;
    const FileText     = p => <Svg {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></Svg>;
    const LogOut       = p => <Svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Svg>;
    const Stethoscope  = p => <Svg {...p}><circle cx="12" cy="12" r="4"/><path d="M16 12v1a4 4 0 0 0 8 0v-3"/><path d="M20 8.5V7a8 8 0 1 0-16 0v6a8 8 0 0 0 8 8"/></Svg>;
    const Video        = p => <Svg {...p}><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></Svg>;

    // ── Components ────────────────────────────────────────────────────────
    const TopBar = ({ profile }) => (
        <div className="bg-white shadow-sm px-6 py-4 flex justify-between items-center mb-8 rounded-b-xl border-b border-indigo-100">
            <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-bold text-lg">
                    {(profile.name || 'P').charAt(0).toUpperCase()}
                </div>
                <div>
                    <h2 className="text-xl font-bold text-gray-800">Welcome, {profile.name}</h2>
                    <p className="text-sm text-gray-500">How are you feeling today?</p>
                </div>
            </div>
            <a href="/logout" className="flex items-center gap-2 text-red-500 hover:text-red-700 font-medium transition">
                <LogOut size={18} /> Logout
            </a>
        </div>
    );

    const ProfileCard = ({ profile }) => (
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col items-center text-center">
            <div className="w-24 h-24 bg-gradient-to-br from-indigo-400 to-purple-500 rounded-full flex items-center justify-center mb-4 shadow-md text-white text-3xl font-bold">
                {(profile.name || 'P').charAt(0).toUpperCase()}
            </div>
            <h3 className="text-xl font-bold text-gray-800">{profile.name}</h3>
            <p className="text-gray-500 mb-4">
                {profile.gender === 'M' ? 'Male' : profile.gender === 'F' ? 'Female' : 'Other'},&nbsp;{profile.age || '--'} yrs
            </p>
            <div className="w-full border-t border-gray-100 pt-4 mt-2">
                <a href="/patient_profile" className="text-indigo-600 font-medium hover:text-indigo-800 flex items-center justify-center gap-1 text-sm">
                    View Full Profile <ChevronRight size={16} />
                </a>
            </div>
        </div>
    );

    const ActionCards = () => (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <a href="/chat_with_ai" className="bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl shadow-lg p-6 text-white flex flex-col justify-between overflow-hidden relative group transition-transform duration-200 hover:scale-[1.02]">
                <div className="absolute -right-4 -top-4 opacity-10 group-hover:opacity-20 transition-opacity">
                    <Activity size={120} />
                </div>
                <div>
                    <div className="bg-white/20 w-12 h-12 rounded-lg flex items-center justify-center mb-4">
                        <Activity size={24} />
                    </div>
                    <h3 className="text-2xl font-bold mb-1">Check Symptoms</h3>
                    <p className="text-blue-100 text-sm mb-4">Talk to our AI Doctor instantly to analyze your symptoms.</p>
                </div>
                <div className="flex items-center gap-2 font-semibold bg-white/20 w-fit px-4 py-2 rounded-lg">
                    Start Chat <ChevronRight size={16} />
                </div>
            </a>
            <a href="/doctor_list" className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col justify-between hover:border-indigo-300 transition-all duration-200 hover:scale-[1.02]">
                <div>
                    <div className="bg-indigo-50 text-indigo-600 w-12 h-12 rounded-lg flex items-center justify-center mb-4">
                        <Stethoscope size={24} />
                    </div>
                    <h3 className="text-xl font-bold text-gray-800 mb-1">Find Doctors</h3>
                    <p className="text-gray-500 text-sm mb-4">Browse specialized doctors and request video consultations.</p>
                </div>
                <div className="flex items-center gap-2 font-semibold text-indigo-600">
                    Browse Directory <ChevronRight size={16} />
                </div>
            </a>
        </div>
    );

    const RequestList = ({ requests }) => (
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mt-8">
            <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <Calendar size={20} className="text-indigo-500" /> Recent Consultations
                </h3>
                <a href="/my_requests/" className="text-indigo-600 text-sm font-medium hover:underline">View All</a>
            </div>
            <div className="divide-y divide-gray-100">
                {requests.length === 0 ? (
                    <div className="p-8 text-center text-gray-500">
                        <Calendar size={48} className="mx-auto text-gray-300 mb-3" />
                        <p>No consultation requests yet.</p>
                        <a href="/doctor_list" className="text-indigo-600 font-medium mt-2 inline-block">Find a doctor</a>
                    </div>
                ) : requests.map(req => (
                    <div key={req.id} className="p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:bg-gray-50 transition-colors">
                        <div className="flex items-start gap-4">
                            <div className="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center flex-shrink-0 mt-1">
                                <Stethoscope size={18} />
                            </div>
                            <div>
                                <h4 className="font-bold text-gray-800 text-lg">Dr. {req.doctor_name}</h4>
                                <p className="text-sm text-gray-500">{req.call_type} Call &bull; {req.created_at}</p>
                                <div className="mt-2 flex items-center gap-2">
                                    {req.status === 'pending'  && <span className="px-3 py-1 bg-yellow-100 text-yellow-800 text-xs font-bold rounded-full">Pending</span>}
                                    {req.status === 'rejected' && <span className="px-3 py-1 bg-red-100 text-red-800 text-xs font-bold rounded-full">Rejected / Expired</span>}
                                    {req.status === 'accepted' && <span className="px-3 py-1 bg-green-100 text-green-800 text-xs font-bold rounded-full flex items-center gap-1"><span className="w-2 h-2 bg-green-500 rounded-full inline-block" style={{animation:'pulse 2s infinite'}}></span> Active</span>}
                                    {req.status === 'completed' && <span className="px-3 py-1 bg-blue-100 text-blue-800 text-xs font-bold rounded-full">Completed</span>}
                                    {req.status === 'accepted' && req.remaining_seconds > 0 && (
                                        <span className="text-xs text-orange-600 font-medium bg-orange-50 px-2 py-1 rounded">
                                            Expires in {Math.floor(req.remaining_seconds / 60)}m {req.remaining_seconds % 60}s
                                        </span>
                                    )}
                                </div>
                            </div>
                        </div>
                        <div>
                            {req.status === 'accepted' ? (
                                <a href={`/video_call/${req.id}/`} className="bg-green-500 hover:bg-green-600 text-white px-5 py-2.5 rounded-lg font-bold flex items-center gap-2 transition-colors">
                                    <Video size={18} /> Join Call
                                </a>
                            ) : req.status === 'completed' ? (
                                <span className="bg-blue-50 text-blue-700 px-5 py-2.5 rounded-lg font-bold text-sm border border-blue-100 inline-block">
                                    Successful
                                </span>
                            ) : (
                                <button disabled className="bg-gray-100 text-gray-400 px-5 py-2.5 rounded-lg font-medium cursor-not-allowed">
                                    {req.status === 'pending' ? 'Awaiting Doctor' : 'Unavailable'}
                                </button>
                            )}
                        </div>
                    </div>
                ))}
            </div>
        </div>
    );

    // ── Main App ──────────────────────────────────────────────────────────
    const PatientDashboard = () => {
        const [data, setData] = useState(null);
        const [feedbackSubmitted, setFeedbackSubmitted] = useState(false);

        useEffect(() => {
            if (window.dashboardData) setData(window.dashboardData);
            if (window.location.search.includes('feedback_submitted=true')) {
                setFeedbackSubmitted(true);
            }
        }, []);

        if (!data) return (
            <div className="min-h-screen flex flex-col items-center justify-center gap-4">
                <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
                <p className="text-gray-400 text-sm">Loading dashboard…</p>
            </div>
        );

        return (
            <div className="min-h-screen pb-12 bg-gray-50">
                <TopBar profile={data.profile} />
                <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
                    {feedbackSubmitted && (
                        <div className="mb-6 p-4 bg-green-50 border border-green-200 text-green-800 rounded-xl font-medium flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                            Thank you for your feedback! The consultation has been successfully completed.
                        </div>
                    )}
                    <div className="flex flex-col lg:flex-row gap-8">
                        <div className="w-full lg:w-1/3 xl:w-1/4">
                            <ProfileCard profile={data.profile} />
                            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mt-6">
                                <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2">
                                    <FileText size={18} className="text-indigo-500" /> Quick Links
                                </h3>
                                <ul className="space-y-3">
                                    <li><a href="/patient_list" className="text-gray-600 hover:text-indigo-600 transition flex items-center gap-2 text-sm"><ChevronRight size={14}/> Medical History</a></li>
                                    <li><a href="/education" className="text-gray-600 hover:text-indigo-600 transition flex items-center gap-2 text-sm"><ChevronRight size={14}/> Health Education</a></li>
                                </ul>
                            </div>
                        </div>
                        <div className="w-full lg:w-2/3 xl:w-3/4">
                            <ActionCards />
                            <RequestList requests={data.requests} />
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById('react-app')).render(<PatientDashboard />);
{% endverbatim %}
</script>
{% endblock %}
