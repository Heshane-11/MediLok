{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediLok - Sign Up</title>

  <link rel="icon" href="{% static 'assets/img/favicon.png' %}">
  <link href="{% static 'assets/css/material-dashboard.css' %}" rel="stylesheet">
</head>

<body class="bg-gray-200">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
  <a class="navbar-brand" href="{% url 'dashboard' %}">MediLok</a>

  <div class="ms-auto">
    <a href="{% url 'dashboard' %}" class="me-3">Dashboard</a>
    <a href="{% url 'profile' %}" class="me-3">Profile</a>
    <a href="{% url 'signup' %}" class="me-3">Sign Up</a>
    <a href="{% url 'login' %}">Sign In</a>
  </div>
</nav>

<!-- Main -->
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="card p-4 shadow" style="width: 400px;">

    <h3 class="text-center mb-3">Doctor Registration</h3>

    <!-- 🔴 ERROR MESSAGE -->
    {% if error %}
      <p style="color:red; text-align:center;">{{ error }}</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <input type="text" name="username" class="form-control" placeholder="Username" required>
      </div>

      <div class="mb-3">
        <input type="password" name="password" class="form-control" placeholder="Password" required>
      </div>

      <div class="mb-3">
        <input type="text" name="doctor_name" class="form-control" placeholder="Doctor Name (e.g., Dr. Smith)" required>
      </div>

      <div class="mb-3">
        <input type="text" name="phone_number" class="form-control" placeholder="Phone Number">
      </div>

      <div class="mb-3">
        <textarea name="doctor_bio" class="form-control" placeholder="Doctor Bio"></textarea>
      </div>

      <button type="submit" class="btn btn-primary w-100">Register</button>

    </form>

    <p class="text-center mt-3">
      Already have a doctor account?
      <a href="{% url 'doctor_login' %}">Sign in</a>
    </p>

  </div>

</div>

</body>
</html>
